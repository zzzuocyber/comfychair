      - name: Apply translation patch
        run: git apply --whitespace=nowarn translation.patch

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ComfyChair-translation.apk
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ComfyChair-translation-APK
          path: out/ComfyChair-translation.apk
          retention-days: 90
